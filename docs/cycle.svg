<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f6fc"/>
      <stop offset="100%" style="stop-color:#e4f0f8"/>
    </linearGradient>

    <!-- Step colors -->
    <!-- 1 Predice    #1B4F8A blue -->
    <!-- 2 Observa    #2196A6 teal-blue -->
    <!-- 3 Analiza    #0D7A6E teal -->
    <!-- 4 Aprende    #1a7a4a green -->
    <!-- 5 Mejora     #e6a817 amber -->

    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0d3a6e" flood-opacity="0.2"/>
    </filter>
    <filter id="centerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#0d3a6e" flood-opacity="0.25"/>
    </filter>
    <filter id="arrowGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arc gradient for the ring -->
    <radialGradient id="ringGrad" cx="50%" cy="50%" r="50%">
      <stop offset="85%" style="stop-color:#ddeef8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c8e0f0;stop-opacity:1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="920" height="480" fill="url(#bgGrad)" rx="18"/>

  <!-- Subtle grid -->
  <g opacity="0.045" stroke="#1B4F8A" stroke-width="1">
    <line x1="0" y1="48" x2="920" y2="48"/><line x1="0" y1="96" x2="920" y2="96"/>
    <line x1="0" y1="144" x2="920" y2="144"/><line x1="0" y1="192" x2="920" y2="192"/>
    <line x1="0" y1="240" x2="920" y2="240"/><line x1="0" y1="288" x2="920" y2="288"/>
    <line x1="0" y1="336" x2="920" y2="336"/><line x1="0" y1="384" x2="920" y2="384"/>
    <line x1="0" y1="432" x2="920" y2="432"/>
    <line x1="92" y1="0" x2="92" y2="480"/><line x1="184" y1="0" x2="184" y2="480"/>
    <line x1="276" y1="0" x2="276" y2="480"/><line x1="368" y1="0" x2="368" y2="480"/>
    <line x1="460" y1="0" x2="460" y2="480"/><line x1="552" y1="0" x2="552" y2="480"/>
    <line x1="644" y1="0" x2="644" y2="480"/><line x1="736" y1="0" x2="736" y2="480"/>
    <line x1="828" y1="0" x2="828" y2="480"/>
  </g>

  <!--
    5 steps placed on a circle:
    Center: (460, 242)   Radius for node centers: 168
    Angles (top = -90°, going clockwise):
      1 Predice   -90°  → (460, 74)
      2 Observa    -90 + 72 = -18°  → (460 + 168*cos(-18°), 242 + 168*sin(-18°))
                   cos(-18°)=0.951, sin(-18°)=-0.309  → (620, 190)
      3 Analiza    54°  → cos(54°)=0.588, sin(54°)=0.809  → (559, 378)
      4 Aprende   126°  → cos(126°)=-0.588, sin(126°)=0.809  → (361, 378)
      5 Mejora    198°  → cos(198°)=-0.951, sin(198°)=-0.309  → (300, 190)
  -->

  <!-- ================================================
       CONNECTING RING (dashed track)
       ================================================ -->
  <circle cx="460" cy="242" r="168" fill="none" stroke="#c0d8ec" stroke-width="3" stroke-dasharray="10,6" opacity="0.6"/>

  <!-- ================================================
       CURVED ARROWS between steps
       Each arrow goes from near one node to near the next (clockwise)
       Using arc paths for a cleaner look
       ================================================ -->

  <!-- Helper: arrowhead markers per color -->
  <defs>
    <marker id="arr1" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1B4F8A"/>
    </marker>
    <marker id="arr2" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2196A6"/>
    </marker>
    <marker id="arr3" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#0D7A6E"/>
    </marker>
    <marker id="arr4" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#1a7a4a"/>
    </marker>
    <marker id="arr5" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#e6a817"/>
    </marker>
  </defs>

  <!--
    Arc from node 1 (460,74) → node 2 (620,190): arc on circle r=168 cx=460 cy=242
    Offset start/end by ~26px along the arc from node centers
    Start angle: -90+9 = -81°  end: -18-9 = -27°
    Start: (460+168*cos(-81°), 242+168*sin(-81°)) = (460+26.3, 242-166) = (486, 76)  ≈ (486,76)
    End:   (460+168*cos(-27°), 242+168*sin(-27°)) = (460+149.7, 242-76.3) = (610,166)
  -->
  <path d="M 486,77 A 168,168 0 0,1 610,167" fill="none" stroke="#1B4F8A" stroke-width="2.8" marker-end="url(#arr1)" filter="url(#arrowGlow)"/>

  <!-- Arc 2→3: from (620,190) → (559,378)
    Start angle: -18+9=-9°  end: 54-9=45°
    Start: (460+168*cos(-9°), 242+168*sin(-9°)) = (460+165.9, 242-26.3) = (626,216)
    End:   (460+168*cos(45°), 242+168*sin(45°)) = (460+118.8, 242+118.8) = (579,361)
  -->
  <path d="M 626,216 A 168,168 0 0,1 579,360" fill="none" stroke="#2196A6" stroke-width="2.8" marker-end="url(#arr2)" filter="url(#arrowGlow)"/>

  <!-- Arc 3→4: from (559,378) → (361,378)
    Start angle: 54+9=63°  end: 126-9=117°
    Start: (460+168*cos(63°), 242+168*sin(63°)) = (460+76.3, 242+149.7) = (536,392)
    End:   (460+168*cos(117°), 242+168*sin(117°)) = (460-76.3, 242+149.7) = (384,392)
  -->
  <path d="M 536,392 A 168,168 0 0,1 384,392" fill="none" stroke="#0D7A6E" stroke-width="2.8" marker-end="url(#arr3)" filter="url(#arrowGlow)"/>

  <!-- Arc 4→5: from (361,378) → (300,190)
    Start angle: 126+9=135°  end: 198-9=189°
    Start: (460+168*cos(135°), 242+168*sin(135°)) = (460-118.8, 242+118.8) = (341,361)
    End:   (460+168*cos(189°), 242+168*sin(189°)) = (460-166, 242-26.3) = (294,216)
  -->
  <path d="M 341,361 A 168,168 0 0,1 294,216" fill="none" stroke="#1a7a4a" stroke-width="2.8" marker-end="url(#arr4)" filter="url(#arrowGlow)"/>

  <!-- Arc 5→1: from (300,190) → (460,74)
    Start angle: 198+9=207°  end: 270-9=261°
    Start: (460+168*cos(207°), 242+168*sin(207°)) = (460-149.7, 242-76.3) = (310,166)
    End:   (460+168*cos(261°), 242+168*sin(261°)) = (460-26.3, 242-166) = (434,76)
  -->
  <path d="M 310,167 A 168,168 0 0,1 434,77" fill="none" stroke="#e6a817" stroke-width="2.8" marker-end="url(#arr5)" filter="url(#arrowGlow)"/>

  <!-- ================================================
       STEP NODES
       ================================================ -->

  <!-- NODE 1: PREDICE  (460, 74) — blue -->
  <g filter="url(#nodeShadow)">
    <circle cx="460" cy="74" r="52" fill="white" stroke="#1B4F8A" stroke-width="3"/>
    <!-- Number badge -->
    <circle cx="436" cy="50" r="12" fill="#1B4F8A"/>
    <text x="436" y="55" text-anchor="middle" font-size="13" fill="white" font-weight="700">1</text>
    <!-- Icon: forecast line -->
    <polyline points="438,82 446,70 454,76 462,62 470,68 478,58 486,64" fill="none" stroke="#1B4F8A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Label -->
    <text x="460" y="102" text-anchor="middle" font-size="13" fill="#1B4F8A" font-weight="800" letter-spacing="0.5">PREDICE</text>
  </g>
  <!-- Sub-label outside node -->
  <text x="460" y="20" text-anchor="middle" font-size="10" fill="#5D6D7E">Pronóstico hora por hora</text>

  <!-- NODE 2: OBSERVA  (620, 190) — teal-blue -->
  <g filter="url(#nodeShadow)">
    <circle cx="620" cy="190" r="52" fill="white" stroke="#2196A6" stroke-width="3"/>
    <circle cx="596" cy="166" r="12" fill="#2196A6"/>
    <text x="596" y="171" text-anchor="middle" font-size="13" fill="white" font-weight="700">2</text>
    <!-- Icon: eye -->
    <ellipse cx="620" cy="192" rx="18" ry="11" fill="none" stroke="#2196A6" stroke-width="2.2"/>
    <circle cx="620" cy="192" r="6" fill="#2196A6" opacity="0.85"/>
    <circle cx="620" cy="192" r="3" fill="white"/>
    <!-- Label -->
    <text x="620" y="218" text-anchor="middle" font-size="13" fill="#2196A6" font-weight="800" letter-spacing="0.5">OBSERVA</text>
  </g>
  <text x="698" y="178" text-anchor="start" font-size="10" fill="#5D6D7E">Compara predicción</text>
  <text x="698" y="192" text-anchor="start" font-size="10" fill="#5D6D7E">vs. realidad</text>

  <!-- NODE 3: ANALIZA  (559, 378) — teal -->
  <g filter="url(#nodeShadow)">
    <circle cx="559" cy="378" r="52" fill="white" stroke="#0D7A6E" stroke-width="3"/>
    <circle cx="535" cy="354" r="12" fill="#0D7A6E"/>
    <text x="535" y="359" text-anchor="middle" font-size="13" fill="white" font-weight="700">3</text>
    <!-- Icon: magnifying glass -->
    <circle cx="557" cy="378" r="14" fill="none" stroke="#0D7A6E" stroke-width="2.2"/>
    <line x1="567" y1="390" x2="578" y2="401" stroke="#0D7A6E" stroke-width="3" stroke-linecap="round"/>
    <!-- Label -->
    <text x="559" y="406" text-anchor="middle" font-size="13" fill="#0D7A6E" font-weight="800" letter-spacing="0.5">ANALIZA</text>
  </g>
  <text x="559" y="446" text-anchor="middle" font-size="10" fill="#5D6D7E">Identifica causas</text>
  <text x="559" y="460" text-anchor="middle" font-size="10" fill="#5D6D7E">de desviaciones</text>

  <!-- NODE 4: APRENDE  (361, 378) — green -->
  <g filter="url(#nodeShadow)">
    <circle cx="361" cy="378" r="52" fill="white" stroke="#1a7a4a" stroke-width="3"/>
    <circle cx="337" cy="354" r="12" fill="#1a7a4a"/>
    <text x="337" y="359" text-anchor="middle" font-size="13" fill="white" font-weight="700">4</text>
    <!-- Icon: brain/neural simplified — two overlapping circles -->
    <circle cx="354" cy="378" r="12" fill="none" stroke="#1a7a4a" stroke-width="2.2"/>
    <circle cx="368" cy="378" r="12" fill="none" stroke="#1a7a4a" stroke-width="2.2"/>
    <line x1="354" y1="368" x2="354" y2="362" stroke="#1a7a4a" stroke-width="2"/>
    <line x1="368" y1="368" x2="368" y2="362" stroke="#1a7a4a" stroke-width="2"/>
    <!-- Label -->
    <text x="361" y="406" text-anchor="middle" font-size="13" fill="#1a7a4a" font-weight="800" letter-spacing="0.5">APRENDE</text>
  </g>
  <text x="361" y="446" text-anchor="middle" font-size="10" fill="#5D6D7E">Incorpora nuevos</text>
  <text x="361" y="460" text-anchor="middle" font-size="10" fill="#5D6D7E">patrones</text>

  <!-- NODE 5: MEJORA  (300, 190) — amber -->
  <g filter="url(#nodeShadow)">
    <circle cx="300" cy="190" r="52" fill="white" stroke="#e6a817" stroke-width="3"/>
    <circle cx="276" cy="166" r="12" fill="#e6a817"/>
    <text x="276" y="171" text-anchor="middle" font-size="13" fill="white" font-weight="700">5</text>
    <!-- Icon: upward arrow + bar -->
    <line x1="300" y1="206" x2="300" y2="174" stroke="#e6a817" stroke-width="2.5" stroke-linecap="round"/>
    <polyline points="290,184 300,172 310,184" fill="none" stroke="#e6a817" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="288" y1="206" x2="312" y2="206" stroke="#e6a817" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Label -->
    <text x="300" y="218" text-anchor="middle" font-size="13" fill="#e6a817" font-weight="800" letter-spacing="0.5">MEJORA</text>
  </g>
  <text x="216" y="178" text-anchor="end" font-size="10" fill="#5D6D7E">Mayor precisión</text>
  <text x="216" y="192" text-anchor="end" font-size="10" fill="#5D6D7E">en cada ciclo</text>

  <!-- ================================================
       CENTER NODE — VOLTA
       ================================================ -->
  <g filter="url(#centerShadow)">
    <!-- Pulse rings -->
    <circle cx="460" cy="242" r="52" fill="none" stroke="#2196A6" stroke-width="1.5" opacity="0.25"/>
    <circle cx="460" cy="242" r="43" fill="none" stroke="#1B4F8A" stroke-width="1.5" opacity="0.35"/>
    <!-- Disc -->
    <circle cx="460" cy="242" r="36" fill="#0d3a6e"/>
    <circle cx="460" cy="242" r="36" fill="none" stroke="#64d8e8" stroke-width="2" opacity="0.6"/>

    <!-- Label -->
    <text x="460" y="292" text-anchor="middle" font-size="12" fill="#1B4F8A" font-weight="700" letter-spacing="3">SphaerAI</text>
  </g>

  <!-- Outer border -->
  <rect x="2" y="2" width="916" height="476" rx="18" fill="none" stroke="#1B4F8A" stroke-width="1.5" opacity="0.12"/>
</svg>